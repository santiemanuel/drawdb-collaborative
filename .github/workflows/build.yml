name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - name: Check server syntax
        run: npm run check:server
      - name: Test server and collaboration protocol
        run: npm run test:server
      - name: Test SQL import compatibility
        run: npm run test:import
      - name: Test collaborative area movement
        run: npm run test:collaboration
      - name: Run eslint
        run: npm run lint
      - name: Run vite build
        run: npm run build
